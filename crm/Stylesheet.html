<style>

/* Layout: feste Seitenleiste links, Arbeitsfläche rechts; am Handy Tab-Leiste unten. Tokens wie cetl.institute. */
:root{
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg:#FBF6F7; --card:#FFFFFF; --soft:#F6E3E8; --line:#EBDFE2;
  --ink:#1F0E13; --ink2:#746166; --ink3:#A08D92;
  --brand:#9B2242; --brand-d:#7A1A36; --brand-l:#E5A9B8; --on-brand:#FFFFFF;
  --side:#2A1119; --side-ink:#E8D5DA;
  --ok:#2F7D5B; --ok-bg:#E4F2EB; --warn:#9A6A12; --warn-bg:#FBF0D9;
  --shadow:0 18px 50px rgba(31,14,19,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#150A0E; --card:#201218; --soft:#33191F; --line:#3A2329;
  --ink:#F5ECEF; --ink2:#BBA7AD; --ink3:#8C777D;
  --brand:#C23A5E; --brand-d:#E5A9B8; --brand-l:#7A1A36; --on-brand:#FFFFFF;
  --side:#0F0609; --side-ink:#D9C3C9;
  --ok:#5FC59A; --ok-bg:#16352A; --warn:#E6B656; --warn-bg:#3A2D12;
  --shadow:0 18px 50px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150A0E; --card:#201218; --soft:#33191F; --line:#3A2329;
  --ink:#F5ECEF; --ink2:#BBA7AD; --ink3:#8C777D;
  --brand:#C23A5E; --brand-d:#E5A9B8; --brand-l:#7A1A36; --on-brand:#FFFFFF;
  --side:#0F0609; --side-ink:#D9C3C9;
  --ok:#5FC59A; --ok-bg:#16352A; --warn:#E6B656; --warn-bg:#3A2D12;
  --shadow:0 18px 50px rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.02em;line-height:1.18}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--brand-d);text-decoration:none}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
/* Seitenleiste */
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:26px 16px 20px}
.side .logo{padding:0 10px 26px}
.side .logo svg{width:150px;height:auto;display:block}
.side .logo svg path{fill:#fff}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;color:var(--side-ink);padding:11px 12px;border-radius:12px;text-align:left;font-weight:500}
.nav button svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button[aria-current="page"]{background:var(--brand);color:#fff}
.nav .n{margin-left:auto;font-size:.74rem;background:rgba(255,255,255,.14);border-radius:999px;padding:1px 8px}
.nav button[aria-current="page"] .n{background:rgba(255,255,255,.25)}
.side .me{margin-top:auto;display:flex;align-items:center;gap:11px;padding:12px 10px 0;border-top:1px solid rgba(255,255,255,.12);font-size:.86rem}
.side .me b{display:block;color:#fff;font-weight:600}
.av{width:36px;height:36px;border-radius:50%;background:var(--brand-l);color:var(--ink);display:grid;place-items:center;font-weight:600;font-size:.82rem;flex:none}
.side .me .av{background:var(--brand);color:#fff}
/* Arbeitsfläche */
.main{min-width:0;padding:34px clamp(16px,4vw,48px) 80px;max-width:1180px;width:100%}
.demo{display:inline-flex;align-items:center;gap:8px;font-size:.76rem;font-weight:500;color:var(--warn);background:var(--warn-bg);border-radius:999px;padding:4px 12px;margin-bottom:22px}
.eyebrow{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--brand-d);margin-bottom:10px}
h1{font-size:clamp(1.7rem,3.2vw,2.3rem);font-weight:600}
.sub{color:var(--ink2);margin-top:8px;max-width:62ch}
.head{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:10px 20px;font-weight:500;border:1px solid transparent;background:var(--brand);color:var(--on-brand);transition:transform .15s ease,background-color .15s ease}
.btn:hover{transform:translateY(-1px);background:var(--brand-d);color:var(--on-brand)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:transparent;border-color:var(--brand);color:var(--ink)}
.btn.sm{padding:6px 14px;font-size:.86rem}
.btn:focus-visible,.nav button:focus-visible,.row:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.pill{display:inline-block;font-size:.74rem;font-weight:600;padding:3px 11px;border-radius:999px;white-space:nowrap}
.pill.lead{background:var(--soft);color:var(--brand-d)}
.pill.interessent{background:var(--warn-bg);color:var(--warn)}
.pill.kunde{background:var(--brand);color:#fff}
.pill.partner{border:1px solid var(--line);color:var(--ink2)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.muted{color:var(--ink2)}
.small{font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.card h3{font-size:1.02rem;margin-bottom:14px}
.cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
.stack{display:grid;gap:20px;min-width:0}
/* Heute */
.band{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(2,minmax(0,1fr));gap:0;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:30px}
.band>div{padding:20px 24px}
.band>div+div{border-left:1px solid var(--line)}
.big{font-size:2rem;font-weight:600;letter-spacing:-.03em;line-height:1}
.bar{height:8px;border-radius:99px;background:var(--soft);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .4s ease}
.sec{margin:30px 0 12px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec h2{font-size:1.1rem}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.5fr) auto;gap:6px 20px;align-items:center;padding:15px 20px;border-top:1px solid var(--line);width:100%;background:none;text-align:left;color:inherit}
.list>.row:first-child{border-top:0}
a.row:hover{background:var(--soft)}
.row .t{font-weight:500;color:var(--ink)}
.row .s{font-size:.86rem;color:var(--ink2)}
.row .acts{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.done{color:var(--ok);font-size:.84rem;font-weight:500;display:inline-flex;align-items:center;gap:6px}
/* Filter */
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
input[type=search],select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 16px}
input[type=search]{min-width:min(100%,260px);flex:1 1 220px}
textarea{border-radius:14px;width:100%;resize:vertical;min-height:90px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:.86rem;font-weight:500;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
/* Vorschläge */
.sugg{display:grid;gap:16px}
.sg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 24px;align-items:start}
.sg h3{margin:0 0 8px}
.why{margin-top:12px;display:grid;gap:6px}
.why p{font-size:.92rem}
.conf{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:.82rem;color:var(--ink2)}
.conf .bar{width:90px;margin:0}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.76rem;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--ink2)}
a.tag:hover{border-color:var(--brand)}
/* Organisation */
.crumb{font-size:.86rem;margin-bottom:14px}
.person{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.person:first-of-type{border-top:0}
.deal{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.deal:first-of-type{border-top:0}
.steps{display:flex;gap:4px;margin-top:6px}
.steps i{width:26px;height:5px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--brand)}
.tl{display:grid}
.tl div{position:relative;padding:0 0 18px 22px;border-left:2px solid var(--line);margin-left:6px}
.tl div::before{content:"";position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--brand)}
.tl div:last-child{border-left-color:transparent;padding-bottom:0}
.tl b{font-weight:500}
/* Produkte */
.pg{margin-bottom:30px}
.pg>h2{font-size:1.1rem;margin-bottom:12px}
.pr{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.4fr) minmax(0,1.3fr);gap:8px 24px;padding:16px 20px;border-top:1px solid var(--line);align-items:center}
.list>.pr:first-child{border-top:0}
.pr h4{font-size:.98rem}
.pct{display:flex;align-items:center;gap:10px;font-size:.84rem;flex-wrap:wrap}
.pct .bar{margin:0;flex:1;min-width:60px}
.pct b{font-variant-numeric:tabular-nums}
/* Speaker */
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.sp{display:grid;gap:10px;align-content:start}
.sp .top{display:flex;gap:12px;align-items:center}
.sp h3{margin:0;font-size:1rem}
/* Entwurf-Fenster */
.scrim{position:fixed;inset:0;background:rgba(20,8,12,.55);z-index:40;display:flex;justify-content:flex-end}
.scrim[hidden]{display:none!important}
.sheet{background:var(--card);width:min(640px,100%);height:100%;overflow:auto;padding:28px 28px 40px;box-shadow:var(--shadow);animation:in .22s ease}
@keyframes in{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.sheet .x{float:right;background:none;border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:.86rem}
.mail{border:1px solid var(--line);border-radius:14px;margin-top:16px}
.mail .mh{padding:12px 16px;border-bottom:1px solid var(--line);font-size:.88rem;color:var(--ink2)}
.mail .mh b{color:var(--ink);font-weight:500}
.mail .mb{padding:16px;white-space:pre-wrap;font-size:.94rem}
.basis{margin-top:16px;background:var(--soft);border-radius:14px;padding:14px 16px;font-size:.88rem}
.basis b{display:block;margin-bottom:2px;font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--brand-d)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;font-size:.9rem;z-index:60;max-width:92vw;box-shadow:var(--shadow)}
.toast[hidden]{display:none!important}
.empty{padding:34px 20px;text-align:center;color:var(--ink2)}
/* Handy */
.tabs{display:none}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .main{padding-top:22px;padding-bottom:104px}
  .tabs{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--side);z-index:30;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .tabs button{background:none;border:0;color:var(--side-ink);display:grid;justify-items:center;gap:3px;font-size:.64rem;padding:6px 0;border-radius:10px}
  .tabs button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tabs button[aria-current="page"]{color:#fff;background:var(--brand)}
  .cols{grid-template-columns:minmax(0,1fr)}
  .band{grid-template-columns:minmax(0,1fr)}
  .band>div+div{border-left:0;border-top:1px solid var(--line)}
  .row{grid-template-columns:minmax(0,1fr) auto}
  .row .mid{grid-column:1/-1;order:3}
  .pr{grid-template-columns:minmax(0,1fr)}
  .sg{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Tabellen: Kunden, Leads, Speaker */
.tbl{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.th,.tr{display:grid;grid-template-columns:var(--cols);gap:6px 22px;padding:15px 20px;align-items:start}
.th{padding-top:12px;padding-bottom:12px;background:var(--bg);border-bottom:1px solid var(--line);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--ink2)}
.tr{border-top:1px solid var(--line);color:inherit;background:none;width:100%;text-align:left;font:inherit}
.th+.tr{border-top:0}
a.tr:hover,button.tr:hover{background:var(--soft)}
.tr>div{min-width:0}
.tr .t{font-weight:500;color:var(--ink)}
.tr .s{font-size:.86rem;color:var(--ink2)}
.tr .stack1{display:grid;gap:6px;justify-items:start}
.mc .mt{font-size:.86rem;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:3px}
.mdir{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.mdir.in{color:var(--brand-d)}
.mdir.out{color:var(--ink2)}
.rl{display:inline-block;font-size:.72rem;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap}
.rl.entscheider{background:var(--brand);color:#fff}
.rl.budget{background:var(--warn-bg);color:var(--warn)}
.rl.fachlich{background:var(--soft);color:var(--brand-d)}
.rl.champion{background:var(--ok-bg);color:var(--ok)}
.rl.anwender{border:1px solid var(--line);color:var(--ink2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--ink3)}
.dot.pro{background:var(--ok)}
.dot.skeptisch{background:var(--brand)}
.mini{height:5px;border-radius:9px;background:var(--soft);width:84px;overflow:hidden;margin-top:6px}
.mini i{display:block;height:100%;background:var(--brand)}
.rate{font-size:1.15rem;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.clamp1{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tools select{border-radius:999px}
/* Stand der Dinge */
.state{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;background:var(--soft);border-radius:16px;padding:18px 22px;margin-bottom:20px}
.state .lab{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--brand-d);margin-bottom:4px}
.state p{max-width:68ch}
.state .nx{font-size:.88rem;color:var(--ink2);margin-top:6px}
/* Mail-Verlauf */
.msg{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;padding:14px 12px;border-top:1px solid var(--line);margin:0 -12px}
.msg:first-of-type{border-top:0}
.msg.wait{background:var(--soft);border-radius:12px;border-top-color:transparent}
.msg .mh1{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:.84rem;color:var(--ink2)}
.msg .mh1 b{color:var(--ink);font-weight:500}
.msg .sj{font-weight:500;margin-top:2px}
.msg .bd{font-size:.92rem;margin-top:4px;white-space:pre-wrap}
.sync{font-size:.8rem;color:var(--ink2);margin-top:12px}
/* Ansprechpartner-Karten */
.ppl{padding:12px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px}
.ppl:first-of-type{border-top:0}
.star{color:var(--brand);font-size:.9rem;margin-left:4px}
.vtr{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 12px;font-size:.92rem}
.vtr dt{color:var(--ink2)}.vtr dd{margin:0}
/* Speaker-Fenster */
.fld{display:grid;gap:6px;margin-top:16px}
.fld>label,.fld>span.l{font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.fld input[type=text],.fld input[type=number],.fld select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.fld textarea{min-height:140px;border-radius:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
@media (max-width:900px){
  .th{display:none}
  .tr{grid-template-columns:minmax(0,1fr)!important;gap:12px;padding:16px}
  .tr>div[data-l]::before{content:attr(data-l);display:block;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--ink3);margin-bottom:3px}
  .state{padding:16px}
  .two{grid-template-columns:minmax(0,1fr)}
  .vtr{grid-template-columns:100px minmax(0,1fr)}
}
/* Ergänzungen für die echte App */
.hbtn{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dbtn{width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;padding:12px 0;color:inherit;font:inherit}
.dbtn:first-of-type{border-top:0}
.dbtn:hover .steps i.on{background:var(--brand-d)}
.lnk{background:none;border:0;color:var(--brand-d);font-size:.78rem;padding:0 0 0 6px;text-decoration:underline;font-weight:400}
.ck{display:flex!important;gap:10px;align-items:center;text-transform:none!important;letter-spacing:0!important;font-size:.92rem!important;color:var(--ink)!important;font-weight:500!important}
.fld input[type=email]{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.pr2{grid-template-columns:minmax(0,1.2fr) minmax(0,1.6fr)}
.empty p{margin-bottom:14px}
.fld[hidden],[data-for][hidden]{display:none!important}
@media (max-width:900px){.pr2{grid-template-columns:minmax(0,1fr)}}

</style>
